  function runCatch(){
    startMusic('catch');
    stageEl.innerHTML =
      '<div class="battle-hud"><span>Score <b class="tabular" id="ctScore">0</b></span><span id="ctTime" class="tabular">'+CATCH_TIME+'s</span></div>' +
      '<div class="battle-wrap"><canvas id="catchCanvas" width="400" height="480"></canvas></div>' +
      '<div class="brawl-controls">' +
        '<div class="brawl-btn" id="ctLeft">◀</div>' +
        '<div class="brawl-btn" id="ctRight">▶</div>' +
      '</div>';
    var canvas = document.getElementById('catchCanvas');
    var ctx = canvas.getContext('2d');
    var scoreEl = document.getElementById('ctScore');
    var timeEl = document.getElementById('ctTime');
    var W = canvas.width, H = canvas.height;
    var BASKET_Y = H - 46;

    var running = true, rafId = null, timerId = null;
    var timeLeft = CATCH_TIME, score = 0, combo = 0;
    var basketX = W/2, keysDown = {left:false, right:false};
    var items = [], lastSpawn = 0, flashTimer = 0;
    var particles = [];
    var stars = makeStarfield(30, W, BASKET_Y-20);
    var demonColors = ['#52E8C6','#8E7CFF','#FF8B5E','#FFD36E'];

    function drawStar(cx,cy,r,color){
      ctx.save();
      ctx.translate(cx,cy);
      ctx.beginPath();
      for(var i=0;i<10;i++){
        var rad = i%2===0 ? r : r*0.45;
        var ang = Math.PI/5*i - Math.PI/2;
        var x = Math.cos(ang)*rad, y = Math.sin(ang)*rad;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      ctx.restore();
    }
    function spawnItem(){
      var isStar = Math.random() < 0.7;
      items.push({
        x: 24 + Math.random()*(W-48),
        y: -16,
        r: isStar ? 13 : 22,
        type: isStar ? 'star' : 'gloomling',
        color: demonColors[Math.floor(Math.random()*demonColors.length)],
        speed: 1.4 + Math.random()*1.2 + Math.min(1.6, (CATCH_TIME-timeLeft)/20)
      });
    }
    function spawnParticles(x,y,color){
      for(var i=0;i<8;i++){
        var ang = Math.random()*Math.PI*2;
        particles.push({x:x,y:y,vx:Math.cos(ang)*3,vy:Math.sin(ang)*3,life:18,color:color});
      }
    }
    function drawBasket(){
      var sprite = playableSprite();
      var w=52, h=72;
      ctx.drawImage(sprite, basketX-w/2, BASKET_Y-h, w, h);
    }

    function frame(ts){
      if(!running) return;
      ctx.fillStyle = flashTimer>0 ? 'rgba(255,95,162,.12)' : '#0F0A22';
      ctx.fillRect(0,0,W,H);
      drawStarfield(ctx, stars, ts);
      if(flashTimer>0) flashTimer--;

      if(keysDown.left) basketX -= 4;
      if(keysDown.right) basketX += 4;
      basketX = Math.max(28, Math.min(W-28, basketX));

      if(ts - lastSpawn > Math.max(360, 780 - (CATCH_TIME-timeLeft)*10)){
        spawnItem(); lastSpawn = ts;
      }
      for(var i=items.length-1;i>=0;i--){
        var it = items[i];
        it.y += it.speed;
        if(it.type==='star') drawStar(it.x, it.y, it.r, '#FFC15E');
        else ctx.drawImage(getGloomlingSprite(it.color), it.x-it.r, it.y-it.r, it.r*2, it.r*2);

        var caught = Math.abs(it.x-basketX) < 34 && it.y > BASKET_Y-18 && it.y < BASKET_Y+18;
        if(caught){
          if(it.type==='star'){
            combo++; score += 1 + Math.floor(combo/5);
            spawnParticles(it.x, it.y, '#FFC15E');
            beep(700+combo*6, .08, 'triangle');
          } else {
            combo = 0; score = Math.max(0, score-3); flashTimer = 14;
            spawnParticles(it.x, it.y, '#8E7CFF');
            beep(160,.16,'sawtooth');
          }
          scoreEl.textContent = score;
          items.splice(i,1);
          continue;
        }
        if(it.y - it.r > H){
          if(it.type==='star') combo = 0;
          items.splice(i,1);
        }
      }
      drawBasket();
      for(var p=particles.length-1;p>=0;p--){
        var pt = particles[p];
        pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.12; pt.life--;
        ctx.globalAlpha = Math.max(0,pt.life/18);
        ctx.fillStyle = pt.color;
        ctx.beginPath(); ctx.arc(pt.x,pt.y,3,0,Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
        if(pt.life<=0) particles.splice(p,1);
      }
      rafId = requestAnimationFrame(frame);
    }

    function onKeyDown(e){
      var k = e.key.toLowerCase();
      if(k==='arrowleft'||k==='a') keysDown.left = true;
      if(k==='arrowright'||k==='d') keysDown.right = true;
    }
    function onKeyUp(e){
      var k = e.key.toLowerCase();
      if(k==='arrowleft'||k==='a') keysDown.left = false;
      if(k==='arrowright'||k==='d') keysDown.right = false;
    }
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);

    var btnLeft = document.getElementById('ctLeft');
    var btnRight = document.getElementById('ctRight');
    function holdStart(dir){ return function(ev){ ev.preventDefault(); keysDown[dir]=true; }; }
    function holdEnd(dir){ return function(){ keysDown[dir]=false; }; }
    btnLeft.addEventListener('pointerdown', holdStart('left'));
    btnRight.addEventListener('pointerdown', holdStart('right'));
    ['pointerup','pointerleave','pointercancel'].forEach(function(ev){
      btnLeft.addEventListener(ev, holdEnd('left'));
      btnRight.addEventListener(ev, holdEnd('right'));
    });

    timerId = setInterval(function(){
      timeLeft--;
      timeEl.textContent = timeLeft + 's';
      if(timeLeft<=0) endCatch();
    }, 1000);
    rafId = requestAnimationFrame(frame);

    function endCatch(){
      running = false;
      clearInterval(timerId);
      cancelAnimationFrame(rafId);
      var earned = Math.max(5, Math.round(score/2));
      earnPoints(earned);
      if(score > state.best.catch) state.best.catch = score;
      saveState(); refreshTopbar();
      playFanfare();
      var wrap = stageEl.querySelector('.battle-wrap');
      wrap.insertAdjacentHTML('beforeend',
        '<div class="overlay-center">' +
          '<h2 style="margin:0;">Time’s Up!</h2>' +
          '<p style="color:var(--dim); margin:0;">Score <b class="tabular" style="color:var(--cream);">'+score+'</b> · Earned <b class="tabular" style="color:var(--amber);">⭐'+earned+'</b></p>' +
          '<button class="btn btn-primary" id="catchAgain">Catch Again</button>' +
          '<button class="btn btn-ghost" id="catchDone">Back to Mini-Games</button>' +
        '</div>'
      );
      document.getElementById('catchAgain').addEventListener('click', runCatch);
      document.getElementById('catchDone').addEventListener('click', renderArcadeHub);
    }

    activeCleanup = function(){
      running = false;
      clearInterval(timerId);
      if(rafId) cancelAnimationFrame(rafId);
      window.removeEventListener('keydown', onKeyDown);
      window.removeEventListener('keyup', onKeyUp);
    };
  }

  // ---------------- LANTERN SAYS (Simon-style sequence memory) ----------------
  var LANTERN_SAYS_COLORS = ['#FFC15E','#52E8C6','#FF5FA2','#8E7CFF'];
  var LANTERN_SAYS_NOTES = [PENTA[0], PENTA[3], PENTA[6], PENTA[9]];

  function renderLanternIntro(){
    stageEl.innerHTML =
      '<div class="card" style="text-align:center;">' +
        '<div class="eyebrow">Lantern Says</div>' +
        '<h2 style="margin:4px 0;">Watch, then repeat</h2>' +
        '<p style="color:var(--dim); font-size:13.5px; margin:0 0 4px;">The lanterns light up in a pattern. Tap them back in the same order — the pattern grows by one each round.</p>' +
        '<div style="margin-top:12px; font-size:11px; color:var(--dim);">Best round: <b class="tabular" style="color:var(--amber);">'+state.best.lantern+'</b></div>' +
        '<button class="btn btn-primary" id="startLantern" style="margin-top:12px; width:100%;">Start</button>' +
        '<button class="btn btn-ghost" id="backArcadeLantern" style="margin-top:8px; width:100%;">Back</button>' +
      '</div>';
    document.getElementById('startLantern').addEventListener('click', runLanternSays);
    document.getElementById('backArcadeLantern').addEventListener('click', renderArcadeHub);
  }

  function runLanternSays(){
    startMusic('lantern');
    stageEl.innerHTML =
      '<div class="battle-hud"><span>Round <b class="tabular" id="lsRound">0</b></span><span>Best <b class="tabular" id="lsBest">'+state.best.lantern+'</b></span></div>' +
      '<div class="lantern-says-grid" id="lsGrid">' +
        [0,1,2,3].map(function(i){ return '<button class="ls-lantern" data-i="'+i+'" style="--lc:'+LANTERN_SAYS_COLORS[i]+'" disabled>🏮</button>'; }).join('') +
      '</div>' +
      '<div class="ls-status" id="lsStatus">Get ready...</div>';

    var buttons = stageEl.querySelectorAll('.ls-lantern');
    var statusEl = document.getElementById('lsStatus');
    var roundEl = document.getElementById('lsRound');
    var sequence = [], playerIndex = 0, accepting = false, ended = false;

    function setDisabled(disabled){
      Array.prototype.forEach.call(buttons, function(b){ b.disabled = disabled; });
    }
    function flashLantern(i, dur){
      buttons[i].classList.add('active');
      beep(noteFreq(LANTERN_SAYS_NOTES[i]), .3, 'triangle');
      setTimeout(function(){ buttons[i].classList.remove('active'); }, dur);
    }
    function playSequence(onDone){
      var i = 0;
      function step(){
        if(ended) return;
        if(i >= sequence.length){ onDone(); return; }
        flashLantern(sequence[i], 420);
        i++;
        setTimeout(step, 600);
      }
      setTimeout(step, 400);
    }
    function nextRound(){
      sequence.push(Math.floor(Math.random()*4));
      roundEl.textContent = sequence.length;
      playerIndex = 0;
      accepting = false;
      setDisabled(true);
      statusEl.textContent = 'Watch the pattern...';
      playSequence(function(){
        if(ended) return;
        accepting = true;
        setDisabled(false);
        statusEl.textContent = 'Your turn — repeat it!';
      });
    }

    Array.prototype.forEach.call(buttons, function(btn, i){
      btn.addEventListener('click', function(){
        if(!accepting || ended) return;
        flashLantern(i, 220);
        if(sequence[playerIndex] === i){
          playerIndex++;
          if(playerIndex === sequence.length){
            accepting = false;
            setDisabled(true);
            statusEl.textContent = 'Nice! Next pattern...';
            setTimeout(nextRound, 700);
          }
        } else {
          accepting = false;
          setDisabled(true);
          endLanternSays();
        }
      });
    });

    function endLanternSays(){
      ended = true;
      var roundsCleared = sequence.length - 1;
      var earned = Math.max(5, roundsCleared*3);
      earnPoints(earned);
      if(roundsCleared > state.best.lantern) state.best.lantern = roundsCleared;
      saveState(); refreshTopbar();
      beep(160,.2,'sawtooth');
      if(roundsCleared > 0) playFanfare();
      statusEl.innerHTML =
        'Pattern broken! You cleared <b class="tabular" style="color:var(--cream);">'+roundsCleared+'</b> round'+(roundsCleared===1?'':'s')+
        ' · Earned <b class="tabular" style="color:var(--amber);">⭐'+earned+'</b>';
      var wrap = document.createElement('div');
      wrap.style.marginTop = '14px';
      wrap.innerHTML =
        '<button class="btn btn-primary" id="lsAgain" style="width:100%;">Play Again</button>' +
        '<button class="btn btn-ghost" id="lsDone" style="width:100%; margin-top:8px;">Back to Mini-Games</button>';
      stageEl.appendChild(wrap);
      document.getElementById('lsAgain').addEventListener('click', runLanternSays);
      document.getElementById('lsDone').addEventListener('click', renderArcadeHub);
    }

    nextRound();
    activeCleanup = function(){ ended = true; };
  }

  // ---------------- COMET DASH (3-lane endless dodge/collect runner) ----------------
  function renderCometIntro(){
    stageEl.innerHTML =
      '<div class="card" style="text-align:center;">' +
        '<div class="eyebrow">Comet Dash</div>' +
        '<h2 style="margin:4px 0;">Switch lanes, keep the streak alive</h2>' +
        '<p style="color:var(--dim); font-size:13.5px; margin:0 0 4px;">Swipe or use ◀ ▶ to change lanes. Grab glowsticks for combo points and dodge the Gloomlings — three hits and the patrol\'s over. It only gets faster from here.</p>' +
        '<div style="margin-top:12px; font-size:11px; color:var(--dim);">Best score: <b class="tabular" style="color:var(--amber);">'+state.best.comet+'</b></div>' +
        '<button class="btn btn-primary" id="startComet" style="margin-top:12px; width:100%;">Start Dash</button>' +
        '<button class="btn btn-ghost" id="backArcadeComet" style="margin-top:8px; width:100%;">Back</button>' +
      '</div>';
    document.getElementById('startComet').addEventListener('click', runCometDash);
    document.getElementById('backArcadeComet').addEventListener('click', renderArcadeHub);
  }

  function runCometDash(){
    startMusic('comet');
    stageEl.innerHTML =
      '<div class="battle-hud"><span>Score <b class="tabular" id="cdScore">0</b></span><span id="cdLives">❤️❤️❤️</span></div>' +
      '<div class="battle-wrap"><canvas id="cometCanvas" width="360" height="480"></canvas></div>' +
      '<div class="brawl-controls">' +
        '<div class="brawl-btn" id="cdLeft">◀</div>' +
        '<div class="brawl-btn" id="cdRight">▶</div>' +
      '</div>';
    var canvas = document.getElementById('cometCanvas');
    var ctx = canvas.getContext('2d');
    var scoreEl = document.getElementById('cdScore');
    var livesEl = document.getElementById('cdLives');
    var W = canvas.width, H = canvas.height;
    var LANES = [W*0.22, W*0.5, W*0.78];
    var PLAYER_Y = H - 74;

    var running = true, rafId = null;
    var startTs = null, lastSpawn = 0, flashTimer = 0;
    var lane = 1, playerX = LANES[1];
    var score = 0, combo = 0, lives = 3;
    var items = [], particles = [];
    var stars = makeStarfield(28, W, H);
    var demonColors = ['#52E8C6','#8E7CFF','#FF8B5E','#FFD36E'];

    function spawnItem(elapsedSec){
      var speed = 2.4 + Math.min(3.2, elapsedSec*0.06);
      var isGlow = Math.random() < 0.62;
      items.push({
        lane: Math.floor(Math.random()*3),
        y: -24,
        r: isGlow ? 11 : 20,
        type: isGlow ? 'glow' : 'gloomling',
        hue: Math.floor(Math.random()*360),
        color: demonColors[Math.floor(Math.random()*demonColors.length)],
        speed: speed
      });
    }
    function spawnParticles(x,y,color){
      for(var i=0;i<10;i++){
        var ang = Math.random()*Math.PI*2;
        particles.push({x:x,y:y,vx:Math.cos(ang)*3,vy:Math.sin(ang)*3,life:20,color:color});
      }
    }
    function drawPlayer(){
      var sprite = playableSprite();
      var w=54, h=74;
      ctx.save();
      if(flashTimer>0 && Math.floor(flashTimer/3)%2===0) ctx.globalAlpha = 0.35;
      ctx.drawImage(sprite, playerX-w/2, PLAYER_Y-h+10, w, h);
      ctx.restore();
    }

    function frame(ts){
      if(!running) return;
      if(startTs===null) startTs = ts;
      var elapsedSec = (ts-startTs)/1000;

      ctx.fillStyle = flashTimer>0 ? 'rgba(255,95,162,.12)' : '#0F0A22';
      ctx.fillRect(0,0,W,H);
      drawStarfield(ctx, stars, ts);
      if(flashTimer>0) flashTimer--;

      // lane dividers
      ctx.strokeStyle = 'rgba(245,239,255,.08)'; ctx.lineWidth = 2;
      [0.36, 0.64].forEach(function(f){
        ctx.beginPath(); ctx.moveTo(W*f, 0); ctx.lineTo(W*f, H); ctx.stroke();
      });

      // ease player toward target lane
      var targetX = LANES[lane];
      playerX += (targetX - playerX) * 0.28;

      var spawnGap = Math.max(340, 780 - elapsedSec*14);
      if(ts - lastSpawn > spawnGap){ spawnItem(elapsedSec); lastSpawn = ts; }

      for(var i=items.length-1;i>=0;i--){
        var it = items[i];
        it.y += it.speed;
        var ix = LANES[it.lane];
        if(it.type==='glow'){
          var glowGrad = ctx.createRadialGradient(ix, it.y, 0, ix, it.y, it.r*1.8);
          glowGrad.addColorStop(0, 'hsla('+it.hue+',100%,70%,.55)');
          glowGrad.addColorStop(1, 'hsla('+it.hue+',100%,70%,0)');
          ctx.fillStyle = glowGrad;
          ctx.beginPath(); ctx.arc(ix, it.y, it.r*1.8, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = 'hsl('+it.hue+',100%,65%)';
          ctx.beginPath(); ctx.arc(ix, it.y, it.r, 0, Math.PI*2); ctx.fill();
        } else {
          ctx.drawImage(getGloomlingSprite(it.color), ix-it.r, it.y-it.r, it.r*2, it.r*2);
        }

        var hit = it.lane===lane && Math.abs(it.y-(PLAYER_Y-20)) < 30;
        if(hit){
          if(it.type==='glow'){
            combo++; score += 2 + Math.floor(combo/5);
            spawnParticles(ix, it.y, 'hsl('+it.hue+',100%,65%)');
            beep(620+combo*8, .08, 'triangle');
          } else {
            combo = 0; lives--; flashTimer = 16;
            livesEl.textContent = '❤️'.repeat(Math.max(0,lives)) + '🖤'.repeat(3-Math.max(0,lives));
            spawnParticles(ix, it.y, '#8E7CFF');
            beep(160,.18,'sawtooth');
            if(lives<=0){ items.splice(i,1); endComet(); return; }
          }
          scoreEl.textContent = score;
          items.splice(i,1);
          continue;
        }
        if(it.y - it.r > H) items.splice(i,1);
      }

      // trickle score for distance survived
      score += 0.02 + elapsedSec*0.0008;
      scoreEl.textContent = Math.floor(score);

      drawPlayer();
      for(var p=particles.length-1;p>=0;p--){
        var pt = particles[p];
        pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.12; pt.life--;
        ctx.globalAlpha = Math.max(0,pt.life/20);
        ctx.fillStyle = pt.color;
        ctx.beginPath(); ctx.arc(pt.x,pt.y,3,0,Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
        if(pt.life<=0) particles.splice(p,1);
      }
      rafId = requestAnimationFrame(frame);
    }

    function moveLane(dir){
      lane = Math.max(0, Math.min(2, lane+dir));
      beep(500, .04, 'square');
    }
    function onKeyDown(e){
      var k = e.key.toLowerCase();
      if(k==='arrowleft'||k==='a') moveLane(-1);
      if(k==='arrowright'||k==='d') moveLane(1);
    }
    window.addEventListener('keydown', onKeyDown);

    document.getElementById('cdLeft').addEventListener('pointerdown', function(ev){ ev.preventDefault(); moveLane(-1); });
    document.getElementById('cdRight').addEventListener('pointerdown', function(ev){ ev.preventDefault(); moveLane(1); });

    // swipe left/right on the canvas itself
    var touchStartX = null;
    canvas.addEventListener('pointerdown', function(ev){ touchStartX = ev.clientX; });
    canvas.addEventListener('pointerup', function(ev){
      if(touchStartX===null) return;
      var dx = ev.clientX - touchStartX;
      if(Math.abs(dx) > 30) moveLane(dx > 0 ? 1 : -1);
      touchStartX = null;
    });

    rafId = requestAnimationFrame(frame);

    function endComet(){
      running = false;
      if(rafId) cancelAnimationFrame(rafId);
      var finalScore = Math.floor(score);
      var earned = Math.max(5, Math.round(finalScore/3));
      earnPoints(earned);
      if(finalScore > state.best.comet) state.best.comet = finalScore;
      saveState(); refreshTopbar();
      playFanfare();
      var wrap = stageEl.querySelector('.battle-wrap');
      wrap.insertAdjacentHTML('beforeend',
        '<div class="overlay-center">' +
          '<h2 style="margin:0;">Patrol\'s Over!</h2>' +
          '<p style="color:var(--dim); margin:0;">Score <b class="tabular" style="color:var(--cream);">'+finalScore+'</b> · Earned <b class="tabular" style="color:var(--amber);">⭐'+earned+'</b></p>' +
          '<button class="btn btn-primary" id="cometAgain">Dash Again</button>' +
          '<button class="btn btn-ghost" id="cometDone">Back to Mini-Games</button>' +
        '</div>'
      );
      document.getElementById('cometAgain').addEventListener('click', runCometDash);
      document.getElementById('cometDone').addEventListener('click', renderArcadeHub);
    }

    activeCleanup = function(){
      running = false;
      if(rafId) cancelAnimationFrame(rafId);
      window.removeEventListener('keydown', onKeyDown);
    };
  }

  // ---------------- STUDY HALL ----------------
  var QUIZ_ROUND_LENGTH = {math:8, grammar:5, reading:3};
  function subjectLabel(subject){
    return subject==='math' ? 'Math' : subject==='grammar' ? 'Grammar' : 'Reading';
  }

  function renderStudyHub(){
    startMusic('study');
    var grades = [1,2,3,4,5];
    var pillsHtml = grades.map(function(g){
      return '<button class="subtab '+(g===state.grade?'active':'')+'" data-grade="'+g+'">Grade '+g+'</button>';
    }).join('');
    stageEl.innerHTML =
      '<div class="eyebrow">Study Hall</div>' +
      '<h2 style="margin:2px 0 8px;">Trainee Lessons</h2>' +
      '<div class="subtabs">'+pillsHtml+'</div>' +
      '<p style="font-size:11.5px;color:var(--dim);margin:8px 0 10px;">Correct answers earn Star Points toward new outfits and battle weapons.</p>' +
      '<div class="arcade-grid">' +
        '<div class="card arcade-card" data-subject="math"><div class="ico">➗</div><h3>Math</h3><p>Add, subtract, multiply, divide.</p><div class="best">Best '+state.best.study.math+'/'+QUIZ_ROUND_LENGTH.math+'</div></div>' +
        '<div class="card arcade-card" data-subject="grammar"><div class="ico">✏️</div><h3>Grammar</h3><p>Nouns, verbs, tricky sentences.</p><div class="best">Best '+state.best.study.grammar+'/'+QUIZ_ROUND_LENGTH.grammar+'</div></div>' +
        '<div class="card arcade-card" data-subject="reading" style="grid-column:1/-1;"><div class="ico">📖</div><h3>Reading</h3><p>Short stories, then a question.</p><div class="best">Best '+state.best.study.reading+'/'+QUIZ_ROUND_LENGTH.reading+'</div></div>' +
      '</div>';
    Array.prototype.forEach.call(stageEl.querySelectorAll('[data-grade]'), function(btn){
      btn.addEventListener('click', function(){
        state.grade = parseInt(btn.dataset.grade, 10);
        saveState();
        renderStudyHub();
      });
    });
    Array.prototype.forEach.call(stageEl.querySelectorAll('[data-subject]'), function(el){
      el.addEventListener('click', function(){ runQuiz(el.dataset.subject); });
    });
  }

  function runQuiz(subject){
    var length = QUIZ_ROUND_LENGTH[subject];
    var questions;
    if(subject==='math'){
      questions = [];
      for(var i=0;i<length;i++){ questions.push(generateMathQuestion(state.grade)); }
    } else if(subject==='grammar'){
      questions = shuffleArray(GRAMMAR_BANK[state.grade].slice()).slice(0, length);
    } else {
      questions = shuffleArray(READING_BANK[state.grade].slice()).slice(0, length);
    }
    var qIndex = 0, correctCount = 0, earnedThisRound = 0;

    function renderQuestion(){
      var item = questions[qIndex];
      var choices = shuffleArray(item.choices.slice());
      var passageHtml = item.passage ? '<div class="quiz-passage">'+item.passage+'</div>' : '';
      stageEl.innerHTML =
        '<div class="battle-hud"><span>'+subjectLabel(subject)+' · Grade '+state.grade+'</span><span>Question <b class="tabular">'+(qIndex+1)+'</b>/'+length+'</span></div>' +
        '<div class="card">' +
          passageHtml +
          '<h3 style="margin:0 0 10px;font-size:15px;text-wrap:balance;">'+item.q+'</h3>' +
          '<div class="quiz-choices">' +
            choices.map(function(c){ return '<button class="quiz-choice">'+c+'</button>'; }).join('') +
          '</div>' +
          '<div class="quiz-feedback" id="quizFeedback"></div>' +
        '</div>';
      var buttons = stageEl.querySelectorAll('.quiz-choice');
      Array.prototype.forEach.call(buttons, function(btn, i){
        btn.addEventListener('click', function(){ handleAnswer(choices[i], item.answer, buttons); });
      });
    }

    function handleAnswer(picked, correctAnswer, buttons){
      Array.prototype.forEach.call(buttons, function(btn){
        btn.disabled = true;
        if(btn.textContent===correctAnswer) btn.classList.add('correct');
        else if(btn.textContent===picked) btn.classList.add('incorrect');
      });
      var feedback = document.getElementById('quizFeedback');
      var isCorrect = picked===correctAnswer;
      if(isCorrect){
        correctCount++;
        earnPoints(3); earnedThisRound += 3;
        saveState(); refreshTopbar();
        feedback.textContent = 'Correct! +3 ⭐';
        feedback.style.color = 'var(--teal)';
        beep(760,.12,'triangle');
      } else {
        feedback.textContent = 'Not quite — the answer is "'+correctAnswer+'".';
        feedback.style.color = 'var(--pink)';
        beep(180,.12,'square');
      }
      var nextBtn = document.createElement('button');
      nextBtn.className = 'btn btn-primary';
      nextBtn.style.marginTop = '12px';
      nextBtn.style.width = '100%';
      nextBtn.textContent = (qIndex < length-1) ? 'Next Question' : 'See Results';
      nextBtn.addEventListener('click', function(){
        qIndex++;
        if(qIndex < length) renderQuestion(); else finishQuiz();
      });
      stageEl.querySelector('.card').appendChild(nextBtn);
    }

    function finishQuiz(){
      if(correctCount > state.best.study[subject]) state.best.study[subject] = correctCount;
      saveState(); refreshTopbar();
      if(correctCount === length) playFanfare();
      stageEl.innerHTML =
        '<div class="card" style="text-align:center;">' +
          '<h2 style="margin:0;">Nice work!</h2>' +
          '<p style="color:var(--dim); margin:6px 0;">You got <b class="tabular" style="color:var(--cream);">'+correctCount+'</b>/'+length+' correct · Earned <b class="tabular" style="color:var(--amber);">⭐'+earnedThisRound+'</b></p>' +
          '<button class="btn btn-primary" id="quizAgain" style="width:100%;">Study Again</button>' +
          '<button class="btn btn-ghost" id="quizDone" style="width:100%; margin-top:8px;">Back to Study Hall</button>' +
        '</div>';
      document.getElementById('quizAgain').addEventListener('click', function(){ runQuiz(subject); });
      document.getElementById('quizDone').addEventListener('click', renderStudyHub);
    }

    renderQuestion();
  }

  setScreen(state.hunter ? 'home' : 'select-hunter');

  // pull any cloud save once sign-in resolves, and adopt it if it's at least as progressed
  // as what's on this device (covers a cleared browser or a different device/browser)
  if(window.CloudSave){
    window.CloudSave.load().then(function(cloudState){
      if(!cloudState) return;
      if((cloudState.totalEarned||0) < (state.totalEarned||0)) return;
      var merged = JSON.parse(JSON.stringify(DEFAULT_STATE));
      for(var k in cloudState){ merged[k] = cloudState[k]; }
      state = merged;
      try{ localStorage.setItem('glowstickPatrolSave', JSON.stringify(state)); }catch(e){}
      refreshTopbar();
      setScreen(state.hunter ? 'home' : 'select-hunter');
      showToast('Cloud save loaded ☁️');
    }).catch(function(){ /* offline, blocked, or sign-in not enabled — keep local save */ });
  }
})();
</script>
